version: '3.8'

services:

  db:
    image: mariadb:latest
    container_name: mariadb-service
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mypass
      MYSQL_DATABASE: woodytoys

# php
  php:
    build: ./php
    container_name: php-service
    volumes:
      - ./web/html/www:/var/www/html/www
    depends_on:
      - db

# Service Web (Nginx)
  web:
    build: ./web
    container_name: nginx-service
    ports:
      - "80:80"
    volumes:
      - ./web/html:/var/www/html
    depends_on:
      - php
